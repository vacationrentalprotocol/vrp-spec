name: Live public routes

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    name: Production answers every public route from main
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Fetch every public route and compare with the repository
        run: npm run check-public-routes:live
