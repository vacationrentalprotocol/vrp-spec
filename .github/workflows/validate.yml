name: Validate VRP Spec Artifacts

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read
  # The review-period step reads the pull request's reviews.
  pull-requests: read

jobs:
  validate:
    name: JSON and schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository with full history (sitemap lastmod reads git dates)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Validate artifacts
        run: npm test

      - name: Updated-stamp guard (spec content changed => landing-page stamp bumped)
        if: github.event_name == 'pull_request'
        # No --depth here: a depth-limited fetch turns the full-history checkout
        # into a shallow one, and the sitemap check below refuses shallow clones.
        run: |
          git fetch origin ${{ github.base_ref }}
          node scripts/check-updated-stamp.mjs origin/${{ github.base_ref }}

      - name: Sitemap lastmod matches git (every <lastmod> is the date of the last commit to the file it serves)
        if: github.event_name == 'pull_request'
        run: npm run check-sitemap

      # GOVERNANCE.md §4: a substantive change (spec/, schemas/, contexts/,
      # docs/adr/, GOVERNANCE.md) waits seven days and two maintainer
      # approvals. This job is a required check, so the step keeps the merge
      # button closed until then. The rule is read from the base branch when it
      # is there, so a pull request cannot loosen the rule it is judged by.
      # review-period-recheck.yml runs the step again when time or a review
      # changes its answer. The step name is read there: keep the two in step.
      - name: Review period (GOVERNANCE.md §4)
        if: always() && github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git fetch origin ${{ github.base_ref }}
          if git cat-file -e origin/${{ github.base_ref }}:scripts/check-review-period.mjs 2>/dev/null; then
            git show origin/${{ github.base_ref }}:scripts/check-review-period.mjs > "$RUNNER_TEMP/check-review-period.mjs"
            node "$RUNNER_TEMP/check-review-period.mjs" origin/${{ github.base_ref }}
          else
            node scripts/check-review-period.mjs origin/${{ github.base_ref }}
          fi

  markdown:
    name: Markdown integrity
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Markdown structure
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          globs: |
            **/*.md
